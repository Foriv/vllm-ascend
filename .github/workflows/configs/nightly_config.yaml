        config_file_path: Qwen3.5-397B-A17B-w4a8-mtp-A2.yaml
        config_base_path: tests/e2e/cases/models/configs/Qwen
      - name: gemma4
        os: linux-aarch64-a2b3-4
        config_file_path: Gemma4.yaml
        config_base_path: tests/e2e/cases/models/configs/Gemma
      - name: gemma4-31b-dense
        os: linux-aarch64-a2b3-4
        config_file_path: Gemma4-31B-Dense.yaml
        config_base_path: tests/e2e/cases/models/configs/Gemma
      - name: MiniMax-M2.5-w8a8-QuaRot-A2
        os: linux-aarch64-a2b3-8
        config_file_path: MiniMax-M2.5-w8a8-QuaRot-A2.yaml
        config_base_path: tests/e2e/cases/models/configs/MiniMax
      - name: Qwen3.8-27B-w8a8-A2
        os: linux-aarch64-a2b3-2
        config_file_path: Qwen3.8-27B-w8a8-A2.yaml
        config_base_path: tests/e2e/cases/models/configs/Qwen
  multi_node:
    test_config:
      - name: multi-node-qwen3-235b-dp
        config_file_path: Qwen3-235B-A22B-A2.yaml
        config_base_path: tests/e2e/cases/models/configs/Qwen
        size: 2
      - name: multi-node-GLM-5.1-w8a8-A2
        config_file_path: GLM5_1-W8A8-A2-dual-nodes.yaml
        config_base_path: tests/e2e/cases/models/configs/GLM
        size: 2
  accuracy:
    nightly:
      - name: accuracy-group-1
        os: linux-aarch64-a2b3-1
        model_list:
          - Qwen3-VL-8B-Instruct-W8A8
          - Qwen3-8B
          - Qwen2-Audio-7B-Instruct
          - Qwen3-8B-W8A8
          - Qwen3-VL-8B-Instruct
          - Minitron-8B-Base
      - name: accuracy-group-3
        os: linux-aarch64-a2b3-2
        model_list:
          - Qwen3-30B-A3B
          - Qwen3-VL-30B-A3B-Instruct
          - Qwen3-30B-A3B-W8A8
      - name: accuracy-group-4
        os: linux-aarch64-a2b3-4
        model_list:
          - Qwen3-Next-80B-A3B-Instruct
          - Qwen3-Omni-30B-A3B-Instruct
          - Mixtral-8x7B-Instruct-v0.1
    pr_only:
      - name: pr-accuracy-group-1
        os: linux-aarch64-a2b3-1
        model_list:
          - gemma-3-4b-it
          - internlm3-8b-instruct
          - Qwen3-ASR-1.7B
